<style>
:root{
  --bg:#0d1310;
  --panel:#141b17;
  --panel2:#182019;
  --line:#26312b;
  --line-soft:#1c241f;
  --ink:#eef1ec;
  --muted:#8b9a90;
  --muted-dim:#5f6b64;
  --brass:#d9a256;
  --brass-dim:#a97e42;
  --teal:#4f9e8f;
  --rust:#c1614a;
  --slate:#6f8fc1;
  --pink:#d9678f;
  --moss:#6fa87d;
  --radius:14px;
  --radius-lg:20px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:radial-gradient(circle at 18% -10%, #17251f, #0d1310 46%);
  background-attachment:fixed;
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
.serif{font-family:"Fraunces",Georgia,serif}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}
.wrap{max-width:640px;margin:0 auto;padding:22px 16px 110px}

header{margin-bottom:18px}
h1{margin:0;font-size:27px;font-weight:700;letter-spacing:.2px}
.version-tag{font-size:11px;font-weight:500;color:var(--muted-dim);margin-left:7px;letter-spacing:.02em;vertical-align:middle}
.tagline{color:var(--muted);font-size:12.5px;margin-top:4px}

.btn{
  appearance:none;border:1px solid var(--line);border-radius:10px;
  background:var(--panel2);color:var(--ink);font-size:13px;font-weight:600;
  padding:9px 12px;cursor:pointer;transition:border-color .15s,background .15s,opacity .15s;
  font-family:inherit;
}
.btn:hover{border-color:var(--brass-dim)}
.btn:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.btn.brass{background:var(--brass);color:#1a1006;border-color:var(--brass)}
.btn.brass:hover{background:#e6b06a}
.btn.accent{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.small{padding:6px 9px;font-size:12px;border-radius:8px}
.btn.danger:hover{border-color:var(--rust);color:var(--rust)}
.btn.wide{width:100%}
.btn:disabled{opacity:.4;cursor:default}
.btn-row{display:flex;gap:6px}
.btn-row .btn{flex:1}

/* condensed stat bar per tab */
.statbar{
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:11px 14px;margin-bottom:14px;font-size:12.5px;color:var(--muted);
}
.statbar b{color:var(--ink);font-family:"IBM Plex Mono",monospace;font-weight:600}
.statbar .dot{color:var(--accent)}

/* season hero (overview) */
.season{
  background:linear-gradient(160deg,var(--panel),var(--panel2));
  border:1px solid var(--line);border-radius:var(--radius-lg);
  padding:16px 16px 14px;margin-bottom:16px;
}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.14em;color:var(--brass);text-transform:uppercase;font-weight:600}
.season-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--bg);border:1px solid var(--line-soft);border-radius:11px;padding:9px 8px}
.stat b{display:block;font-size:15px;font-family:"IBM Plex Mono",monospace;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{color:var(--muted);font-size:9.5px;text-transform:uppercase;letter-spacing:.03em}
.pace-box{margin-top:12px;border-top:1px dashed var(--line);padding-top:11px}
.pace-row{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;color:var(--muted)}
.pace-row b{color:var(--ink);font-family:"IBM Plex Mono",monospace;font-weight:600}
.pace-status{margin-top:6px;font-size:12px;font-weight:600}
.pace-status.good{color:var(--moss)}
.pace-status.behind{color:var(--rust)}
.season-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
@media(min-width:560px){.season-grid{grid-template-columns:repeat(6,1fr)}}

/* overview category tiles */
.reco-card{background:linear-gradient(160deg,var(--panel),var(--panel2));border:1.5px solid var(--accent);border-radius:var(--radius-lg);padding:16px;margin-bottom:16px}
.reco-clickzone{cursor:pointer}
.reco-top-row{display:flex;align-items:center;justify-content:space-between}
.reco-chevron-wrap{color:var(--muted-dim);font-size:11px}
.reco-chevron{display:inline-block;font-size:16px;line-height:1;vertical-align:middle;transition:transform .2s ease}
.reco-card:has(.archive-expand.open) .reco-chevron{transform:rotate(180deg)}
.reco-top{display:flex;align-items:center;gap:10px;margin-top:9px}
.reco-name{font-size:17px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reco-score-badge{font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;border:1.5px solid var(--accent);color:var(--accent);flex-shrink:0}
.reco-msg{color:var(--muted);font-size:13px;line-height:1.45;margin-top:8px}
.reco-board-head{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-dim);margin-bottom:7px}
.reco-row{padding:7px 0;border-bottom:1px solid var(--line-soft)}
.reco-row:last-child{border-bottom:none}
.reco-row-top{display:flex;align-items:center;gap:8px}
.reco-rank{color:var(--muted-dim);font-size:11px;font-weight:700;width:16px;flex-shrink:0}
.reco-row.top .reco-rank{color:var(--brass)}
.reco-row-name{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reco-row.top .reco-row-name{color:var(--brass)}
.reco-row-remain{font-size:10.5px;color:var(--muted);flex-shrink:0}
.reco-score{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;border:1px solid var(--accent);color:var(--accent);flex-shrink:0}
.reco-bar-track{height:3px;background:var(--bg);border-radius:99px;margin-top:5px;overflow:hidden}
.reco-bar-fill{height:100%;border-radius:99px;background:var(--accent)}
.reco-cta{margin-top:12px;padding-top:11px;border-top:1px solid var(--line-soft);text-align:center;font-size:12.5px;font-weight:600;color:var(--accent);cursor:pointer}
@keyframes pageInRight{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:translateX(0)}}
@keyframes pageInLeft{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:translateX(0)}}
.page-enter-right{animation:pageInRight .24s ease}
.page-enter-left{animation:pageInLeft .24s ease}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.tile{
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;
  cursor:pointer;transition:border-color .15s;text-align:left;color:var(--ink);
}
.tile:hover{border-color:var(--accent)}
.tile-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.mono-badge{
  width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  border:1.5px solid var(--accent);color:var(--accent);font-family:"Fraunces",serif;font-weight:600;font-size:13px;
}
.tile-pct{font-family:"IBM Plex Mono",monospace;font-size:15px;color:var(--accent);font-weight:600}
.tile-name{font-family:"Fraunces",serif;font-weight:600;font-size:15px}
.tile-sub{color:var(--muted);font-size:11px;margin-top:2px}
.tile-bar{height:5px;background:var(--bg);border-radius:99px;margin-top:9px;overflow:hidden}
.tile-fill{height:100%;background:var(--accent);border-radius:99px}

.archive-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:9px;cursor:pointer}
.archive-card.live{border-color:var(--brass)}
.archive-top{display:flex;justify-content:space-between;align-items:baseline}
.archive-label{font-size:15px;font-weight:600}
.archive-days{color:var(--brass);font-size:11.5px}
.archive-stats{display:flex;flex-wrap:wrap;gap:5px 12px;margin-top:6px;color:var(--muted);font-size:11px}
.archive-expand{display:none;margin-top:11px;padding-top:11px;border-top:1px solid var(--line-soft)}
.archive-expand.open{display:block}
.archive-detail-group{margin-bottom:9px}
.archive-detail-group:last-child{margin-bottom:0}
.archive-detail-group b{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted-dim);margin-bottom:4px}
.archive-detail-item{font-size:12.5px;color:var(--ink);padding:2px 0}
.archive-detail-item.muted{color:var(--muted)}

.list-head{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 10px}
.list-head b{font-size:13px;color:var(--muted);letter-spacing:.02em}
select{
  background:var(--panel2);color:var(--ink);border:1px solid var(--line);
  border-radius:9px;padding:7px 9px;font-size:12px;font-family:inherit;
}

.marginalia{display:flex;align-items:center;gap:10px;margin:0 2px 8px;color:var(--brass-dim);font-style:italic;font-size:12.5px}
.marginalia::before,.marginalia::after{content:"";flex:1;height:1px;background:var(--line)}

.entry{
  position:relative;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius-lg);padding:15px;margin-bottom:12px;
  animation:rise .35s ease both;
}
@media (prefers-reduced-motion: reduce){.entry{animation:none}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.entry.active{border-color:var(--accent)}
.entry.complete{border-color:var(--moss)}
.entry.timing{border-color:var(--rust)}
.entry-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.entry-name{font-family:"Fraunces",serif;font-weight:600;font-size:17px;line-height:1.25}
.entry-meta{color:var(--muted);font-size:11.5px;margin-top:3px}
.entry-pct{font-family:"IBM Plex Mono",monospace;font-size:15px;color:var(--accent);font-weight:600;white-space:nowrap}
.complete .entry-pct{color:var(--moss)}

.gauge{position:relative;height:10px;background:var(--bg);border:1px solid var(--line-soft);border-radius:99px;margin:13px 0 10px;overflow:hidden}
.gauge-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .35s ease}
.complete .gauge-fill{background:var(--moss)}
.gauge::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:repeating-linear-gradient(90deg,transparent 0 9.9%,rgba(13,19,16,.55) 9.9% 10%)}

.entry-stats{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.played{font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:600}
.entry-meta2{color:var(--muted);font-size:11px}
.remaining{font-size:12px;font-weight:600;color:var(--accent);text-align:right;white-space:nowrap}
.complete .remaining{color:var(--moss)}

.controls{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:13px}
.entry-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px}
.dlc-tag{font-size:11px;color:var(--accent)}
.foot-links{display:flex;gap:14px}
.foot-links button{background:none;border:none;color:var(--muted);font-size:11.5px;font-family:inherit;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px}
.foot-links button:hover{color:var(--ink)}

/* timer */
.timer-box{
  display:flex;align-items:center;justify-content:center;gap:8px;
  background:var(--bg);border:1px solid var(--rust);border-radius:12px;
  padding:14px;margin-top:13px;
}
.timer-dot{width:8px;height:8px;border-radius:50%;background:var(--rust);animation:pulse 1.4s infinite}
@media (prefers-reduced-motion: reduce){.timer-dot{animation:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.timer-time{font-family:"IBM Plex Mono",monospace;font-size:19px;font-weight:600;letter-spacing:.02em}

.stamp{
  position:absolute;top:-10px;right:14px;width:52px;height:52px;border-radius:50%;
  border:2px double var(--moss);display:flex;align-items:center;justify-content:center;
  flex-direction:column;background:var(--panel);transform:rotate(-9deg);
  font-family:"IBM Plex Mono",monospace;color:var(--moss);
}
.stamp b{font-size:15px;line-height:1}
.stamp span{font-size:6.5px;letter-spacing:.08em;margin-top:1px}
.stamp.stamp2{right:70px;width:44px;height:44px;border-color:var(--teal);color:var(--teal);transform:rotate(8deg)}
.stamp.stamp2 b{font-size:13px}

.dlcs{display:none;border-top:1px solid var(--line-soft);margin-top:13px;padding-top:12px}
.dlcs.open{display:block}
.dlc-row{padding:9px 0;border-bottom:1px solid var(--line-soft)}
.dlc-row:last-child{border-bottom:none}
.dlc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.dlc-name{font-size:13px;font-weight:600}
.dlc-val{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted)}
.dlc-bar{height:5px;background:var(--bg);border-radius:99px;margin:7px 0;overflow:hidden}
.dlc-fill{height:100%;background:var(--accent);border-radius:99px}

/* episode groups (shows/anime) — visible by default, not collapsed */
.groups{border-top:1px solid var(--line-soft);margin-top:13px;padding-top:12px}
.group-row{padding:9px 0;border-bottom:1px solid var(--line-soft)}
.group-row:last-child{border-bottom:none}
.group-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.group-name{font-size:13px;font-weight:600}
.group-count{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted)}
.group-bar{height:5px;background:var(--bg);border-radius:99px;margin:7px 0;overflow:hidden}
.group-fill{height:100%;background:var(--accent);border-radius:99px}
.stepper{display:flex;align-items:center;gap:8px;margin-top:6px}
.stepper button{
  width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);
  color:var(--ink);font-size:14px;line-height:1;cursor:pointer;font-family:inherit;
}
.stepper button:hover{border-color:var(--accent)}
.stepper span{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted);min-width:52px;text-align:center}

.empty{text-align:center;color:var(--muted);padding:48px 20px;border:1px dashed var(--line);border-radius:var(--radius-lg)}
.empty .serif{font-size:19px;color:var(--ink);display:block;margin-bottom:6px}

.abandoned-entry{opacity:.55;border-style:dashed;padding:13px 15px}
.abandoned-entry .entry-name{color:var(--muted)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(9,12,10,.72);display:none;align-items:flex-end;justify-content:center;padding:12px;z-index:50}
.modal.show{display:flex}
.sheet{width:min(640px,100%);max-height:90vh;overflow:auto;background:#141b17;border:1px solid var(--line);border-radius:20px;padding:20px 20px calc(20px + env(safe-area-inset-bottom))}
.sheet h2{font-family:"Fraunces",serif;margin:0 0 4px;font-size:20px}
.hint{color:var(--muted);font-size:11.5px;margin-bottom:14px}
label{display:block;color:var(--muted);font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin:14px 0 6px}
input,select.field{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:15px;font-family:inherit}
input:focus-visible{outline:2px solid var(--brass);outline-offset:1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.radio-row{display:flex;gap:8px;margin-top:2px}
.radio-opt{
  flex:1;border:1px solid var(--line);border-radius:10px;padding:9px;text-align:center;
  font-size:12.5px;cursor:pointer;color:var(--muted);
}
.radio-opt.sel{border-color:var(--accent);color:var(--accent);background:rgba(217,166,86,.06)}
.dlc-section{border-top:1px solid var(--line);margin-top:16px;padding-top:14px;display:none}
.dlc-section.open{display:block}
.dlc-section > b{font-size:13px}
.check{display:flex;align-items:center;gap:8px;margin-top:16px;font-size:13px;color:var(--ink);text-transform:none;font-weight:500}
.check input{width:auto}
.dlc-edit{display:grid;grid-template-columns:1.3fr .8fr .7fr auto;gap:6px;margin:8px 0}
.group-edit{display:grid;gap:6px;margin:6px 0;align-items:center}
.group-edit.numbered{grid-template-columns:.55fr .85fr .85fr auto}
.group-edit.named{grid-template-columns:1.6fr .8fr .8fr auto}
.group-edit-head{display:grid;gap:6px;margin-top:12px;padding:0 1px;color:var(--muted-dim);font-size:9.5px;text-transform:uppercase;letter-spacing:.05em}
.group-edit-head.numbered{grid-template-columns:.55fr .85fr .85fr auto}
.group-edit-head.named{grid-template-columns:1.6fr .8fr .8fr auto}
.group-edit-head span:last-child{width:26px}
.dlc-edit select{width:100%}
.actions{display:flex;gap:8px;margin-top:20px}
.actions .btn{flex:1;text-align:center}

.toast{position:fixed;bottom:78px;left:50%;transform:translate(-50%,16px);opacity:0;background:#1c241f;border:1px solid var(--line);color:var(--ink);padding:10px 16px;border-radius:10px;font-size:13px;transition:.2s;z-index:20;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* tab bar */
.tabbar{
  position:fixed;bottom:0;left:0;right:0;background:#121815;border-top:1px solid var(--line);
  display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:15;
}
.tab{
  flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:4px 2px;cursor:pointer;font-family:inherit;
}
.tab .mono-badge{width:32px;height:32px;font-size:12px;border-color:var(--line);color:var(--muted-dim);transition:.15s}
.tab.on .mono-badge{border-color:var(--tabcolor);color:var(--tabcolor);background:rgba(255,255,255,.03)}
.tab span{font-size:9.5px;color:var(--muted-dim);letter-spacing:.02em}
.tab.on span{color:var(--tabcolor);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="serif">Expedition<span class="version-tag mono" id="verTag"></span></h1>
    <div class="tagline">Log the hours. Clear the backlog.</div>
  </header>
  <main id="app"></main>
</div>

<nav class="tabbar" id="tabbar"></nav>

<!-- game modal -->
<div class="modal" id="gameModal">
  <div class="sheet">
    <h2 class="serif" id="formTitle">New entry</h2>
    <div class="hint">Saved to this device only.</div>
    <label>Game</label>
    <input id="gname" placeholder="e.g. Metro Exodus">
    <div class="row2">
      <div><label>Target hours</label><input id="goal" type="number" min=".1" step=".1" inputmode="decimal"></div>
      <div><label>Already played</label><input id="played" type="number" min="0" step=".1" value="0" inputmode="decimal"></div>
    </div>
    <label class="check" style="text-transform:none"><input id="hasDlc" type="checkbox" onchange="toggleDlcSection()"> This one has DLC / extra content to track</label>
    <div id="dlcSection" class="dlc-section">
      <b>DLC / extra content</b>
      <div id="dlcRows"></div>
      <button class="btn small" style="margin-top:6px" onclick="addDlcRow()">+ Add DLC</button>
    </div>
    <div class="actions">
      <button class="btn" onclick="closeModal('gameModal')">Cancel</button>
      <button class="btn brass" onclick="saveGame()">Save entry</button>
    </div>
  </div>
</div>

<!-- movie modal -->
<div class="modal" id="movieModal">
  <div class="sheet">
    <h2 class="serif" id="movieFormTitle">New movie</h2>
    <div class="hint">Length in minutes — the card will show it as h/m automatically.</div>
    <label>Title</label>
    <input id="mname" placeholder="e.g. Blade Runner 2049">
    <label>Length (minutes)</label>
    <input id="mlength" type="number" min="1" inputmode="numeric" placeholder="e.g. 107">
    <div class="actions">
      <button class="btn" onclick="closeModal('movieModal')">Cancel</button>
      <button class="btn brass" onclick="saveMovie()">Save movie</button>
    </div>
  </div>
</div>

<!-- episodic modal (tv shows + anime) -->
<div class="modal" id="epiModal">
  <div class="sheet">
    <h2 class="serif" id="epiFormTitle">New show</h2>
    <div class="hint" id="epiHint">Saved to this device only.</div>
    <label id="epiNameLabel">Title</label>
    <input id="epiname" placeholder="e.g. Game of Thrones">
    <label>Average episode length (minutes)</label>
    <input id="epilen" type="number" min="1" inputmode="numeric" placeholder="e.g. 60">
    <div id="groupTypeRow" style="display:none">
      <label>Grouped by</label>
      <div class="radio-row">
        <div class="radio-opt" id="optSeason" onclick="setGroupType('season')">Seasons</div>
        <div class="radio-opt" id="optArc" onclick="setGroupType('arc')">Arcs</div>
      </div>
    </div>
    <label id="groupsLabel">Seasons</label>
    <div id="groupHeader" class="group-edit-head"></div>
    <div id="groupRows"></div>
    <button class="btn small" style="margin-top:6px" id="addGroupBtn" onclick="addGroupRow()">+ Add season</button>
    <div class="actions">
      <button class="btn" onclick="closeModal('epiModal')">Cancel</button>
      <button class="btn brass" onclick="saveEpisodic()">Save</button>
    </div>
  </div>
</div>

<!-- session modal (games + movies manual time) -->
<div class="modal" id="sessionModal">
  <div class="sheet">
    <h2 class="serif">Log a session</h2>
    <div class="hint" id="sessionName"></div>
    <div class="row2">
      <div><label>Hours</label><input id="sh" type="number" min="0" value="0" inputmode="numeric"></div>
      <div><label>Minutes</label><input id="sm" type="number" min="0" max="59" value="0" inputmode="numeric"></div>
    </div>
    <div class="btn-row" style="margin-top:8px">
      <button class="btn small" onclick="setQuickMinutes(30)">30m</button>
      <button class="btn small" onclick="setQuickMinutes(60)">1h</button>
      <button class="btn small" onclick="setQuickMinutes(120)">2h</button>
    </div>
    <div class="actions">
      <button class="btn" onclick="closeModal('sessionModal')">Cancel</button>
      <button class="btn brass" onclick="addSession()">Log it</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const KEY = "expedition-log-v1";
const APP_VERSION = "0.9.1"; // single source of truth for the version tag in the header
const CAT = {
  overview:{color:"#d9a256", text:"#1a1006", label:"Overview"},
  games:   {color:"#4f9e8f", text:"#0c1613", label:"Games"},
  movies:  {color:"#c1614a", text:"#1c0d09", label:"Movies"},
  tv:      {color:"#6f8fc1", text:"#0b1220", label:"Shows"},
  anime:   {color:"#d9678f", text:"#210812", label:"Anime"},
};
const ICON_SVG = {
  overview: `<path d="M3.5 9.5L10 4l6.5 5.5M5.5 8.7V16h9V8.7"/>`,
  games:    `<rect x="2.3" y="6.7" width="15.4" height="7.6" rx="3.8"/><path d="M6.6 9.3v2M5.6 10.3h2"/><circle cx="14.2" cy="9.4" r=".55" fill="currentColor" stroke="none"/><circle cx="12.6" cy="11" r=".55" fill="currentColor" stroke="none"/>`,
  movies:   `<rect x="2.8" y="7.3" width="14.4" height="9.2" rx="1.3"/><path d="M3.3 7.3l2.3-3.4h2.6L5.9 7.3M9.6 7.3l2.3-3.4h2.6l-2.3 3.4"/>`,
  tv:       `<rect x="3" y="5.3" width="14" height="9.4" rx="1.4"/><path d="M8 17h4M10 14.7V17M7.4 3l2.6 2 2.6-2"/>`,
  anime:    `<path d="M10 3.2l1.5 4L15.5 8.7l-4 1.5L10 14.2l-1.5-4L4.5 8.7l4-1.5L10 3.2z"/>`,
};
function iconBadge(cat){
  return `<svg viewBox="0 0 20 20" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">${ICON_SVG[cat]}</svg>`;
}

const $ = id => document.getElementById(id);
const uid = () => Math.random().toString(36).slice(2,9);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtN = n => Number.isInteger(n) ? String(n) : n.toFixed(1);
const fmtHM = mins => Math.floor(mins/60) + "h " + Math.round(mins%60) + "m";
const fmtElapsed = ms => {
  const h = Math.floor(ms/3600000), m = Math.floor((ms%3600000)/60000), s = Math.floor((ms%60000)/1000);
  return (h ? h+"h " : "") + String(m).padStart(2,"0") + "m " + String(s).padStart(2,"0") + "s";
};

function load(){
  let raw = null;
  try{ raw = JSON.parse(localStorage.getItem(KEY) || "null"); }catch(e){}
  raw = raw || {};
  return {
    version: 2,
    seasonStart: raw.seasonStart || "",
    archive: raw.archive || [],
    sessionLog: raw.sessionLog || [],
    games: (raw.games||[]).map(g => ({...g, id:g.id||uid(), timerStart:g.timerStart||null,
      dlcs:(g.dlcs||[]).map(d=>({...d,id:d.id||uid()}))})),
    movies: raw.movies || [],
    tv: raw.tv || raw.shows || [],
    anime: raw.anime || [],
  };
}
let S = load();
ensureSeason();
localStorage.setItem(KEY, JSON.stringify(S));
let activeTab = localStorage.getItem("expedition-tab") || "overview";
let editId = null, sessionCtx = null, epiCategory = null, groupTypeSel = "season", epiInitializing = false;

function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function toISODate(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function quarterStartFor(date){ const qm = Math.floor(date.getMonth()/3)*3; return new Date(date.getFullYear(), qm, 1); }
function quarterEndFor(startDate){ return new Date(startDate.getFullYear(), startDate.getMonth()+3, 0); }
function quarterLabel(dateStr){
  const d = dateStr ? new Date(dateStr+"T00:00:00") : new Date();
  const q = Math.floor(d.getMonth()/3)+1;
  return d.getFullYear()+" Q"+q;
}
function quarterLabelDedup(startStr){
  let label = quarterLabel(startStr);
  const dupes = S.archive.filter(a=>a.label===label || a.label.startsWith(label+" · ")).length;
  if(dupes>0) label = label + " · " + (dupes+1);
  return label;
}
function allDlcCleared(g){ const d=g.dlcs||[]; return d.length>0 && d.every(dlcCleared); }

/* Splits any list of items into {completed, carry, abandoned} and tallies finished minutes + name lists.
   Shared by the live "current season" card and by the actual quarter rollover, so both always agree. */
function seasonSnapshot(gamesList, moviesList, tvList, animeList){
  const completedGames=[], carryGames=[];
  gamesList.forEach(g=>{
    if(g.abandoned) return;
    const {goal,played} = gameMin(g);
    const mainDone = goal>0 && played>=goal;
    const hasDlcAny = g.hasDlc && (g.dlcs||[]).length>0;
    const fullyDone = mainDone && (!hasDlcAny || allDlcCleared(g));
    (fullyDone ? completedGames : carryGames).push(g);
  });
  const abandonedGames = gamesList.filter(g=>g.abandoned);
  function splitSimple(list, fn){
    const completed=[], carry=[];
    list.forEach(x=>{ if(x.abandoned) return; const {goal,played}=fn(x); (goal>0 && played>=goal ? completed : carry).push(x); });
    return { completed, carry, abandoned: list.filter(x=>x.abandoned) };
  }
  const movieSplit = splitSimple(moviesList, movieMin);
  const tvSplit = splitSimple(tvList, episodicMin);
  const animeSplit = splitSimple(animeList, episodicMin);
  let finishedMin = 0;
  completedGames.forEach(g=>finishedMin+=gameMin(g).played);
  movieSplit.completed.forEach(m=>finishedMin+=movieMin(m).played);
  tvSplit.completed.forEach(e=>finishedMin+=episodicMin(e).played);
  animeSplit.completed.forEach(e=>finishedMin+=episodicMin(e).played);
  const episodicCompletedList = [
    ...tvSplit.completed.map(e=>({name:e.name, category:"tv", units:(e.groups||[]).length})),
    ...animeSplit.completed.map(e=>({name:e.name, category:"anime", units:(e.groups||[]).length})),
  ];
  const abandonedList = [
    ...abandonedGames.map(g=>({name:g.name, category:"games", note:g.abandonNote})),
    ...movieSplit.abandoned.map(m=>({name:m.name, category:"movies", note:m.abandonNote})),
    ...tvSplit.abandoned.map(e=>({name:e.name, category:"tv", note:e.abandonNote})),
    ...animeSplit.abandoned.map(e=>({name:e.name, category:"anime", note:e.abandonNote})),
  ];
  return {
    finishedMin,
    games: completedGames.map(g=>({name:g.name})),
    movies: movieSplit.completed.map(m=>({name:m.name})),
    episodic: episodicCompletedList,
    abandoned: abandonedList,
    carryGames, carryMovies: movieSplit.carry, carryTv: tvSplit.carry, carryAnime: animeSplit.carry,
  };
}
function performRollover(newStartStr){
  const oldStart = S.seasonStart;
  const label = quarterLabelDedup(oldStart);
  const snap = seasonSnapshot(S.games, S.movies, S.tv, S.anime);
  const rolloverDate = todayStr();
  const days = Math.max(1, Math.round((new Date(rolloverDate+"T00:00:00")-new Date(oldStart+"T00:00:00"))/86400000)+1);
  S.archive.unshift({
    id: uid(), label, start: oldStart, end: rolloverDate, days,
    finishedHours: Math.round(snap.finishedMin/60*10)/10,
    games: snap.games, movies: snap.movies, episodic: snap.episodic, abandoned: snap.abandoned,
  });
  S.games = snap.carryGames; S.movies = snap.carryMovies; S.tv = snap.carryTv; S.anime = snap.carryAnime;
  S.seasonStart = newStartStr;
  toast(`🎉 "${label}" archived — carrying forward what's still in progress.`);
}
function ensureSeason(){
  const qStartStr = toISODate(quarterStartFor(new Date()));
  if(!S.seasonStart){ S.seasonStart = qStartStr; return; }
  const storedQStartStr = toISODate(quarterStartFor(new Date(S.seasonStart+"T00:00:00")));
  if(storedQStartStr === qStartStr){
    // Same calendar quarter as before — just realign the stored date, never archive.
    S.seasonStart = qStartStr;
    return;
  }
  performRollover(qStartStr);
}
function persist(){
  ensureSeason();
  localStorage.setItem(KEY, JSON.stringify(S));
  render();
}
function logAction(category, id, name, minutes, action){
  if(!S.sessionLog) S.sessionLog = [];
  if(minutes<=0) return;
  S.sessionLog.push({ ts: Date.now(), category, id, name, minutes: Math.round(minutes), action });
  if(S.sessionLog.length > 60) S.sessionLog = S.sessionLog.slice(-60);
}
function closeModal(id){ $(id).classList.remove("show"); }

function daysLeft(){
  if(!S.seasonStart) return null;
  const end = quarterEndFor(new Date(S.seasonStart+"T00:00:00"));
  const now = new Date(); now.setHours(0,0,0,0);
  return Math.ceil((end - now) / 86400000);
}
function seasonLengthDays(){
  if(!S.seasonStart) return 90;
  const start = quarterStartFor(new Date(S.seasonStart+"T00:00:00"));
  const end = quarterEndFor(start);
  return Math.round((end-start)/86400000) + 1;
}

/* ---------- minute helpers per category ---------- */
function gameMin(g){ return { goal:g.goal*60, played:g.played*60 }; }
function movieMin(m){ return { goal:m.length, played:m.watched }; }
function episodicMin(e){
  const goal = (e.groups||[]).reduce((a,gr)=>a+gr.total,0) * e.epLen;
  const played = (e.groups||[]).reduce((a,gr)=>a+gr.watched,0) * e.epLen;
  return { goal, played };
}
const MIN_FN = { games:gameMin, movies:movieMin, tv:episodicMin, anime:episodicMin };

function categoryTotals(cat){
  const list = (S[cat] || []).filter(x=>!x.abandoned);
  const fn = MIN_FN[cat];
  return list.reduce((a,item)=>{ const {goal,played}=fn(item); a.goal+=goal; a.played+=played; a.count++; if(played>=goal && goal>0) a.done++; return a; }, {goal:0,played:0,count:0,done:0});
}
function combinedTotals(){
  const cats = ["games","movies","tv","anime"];
  return cats.reduce((a,c)=>{ const t=categoryTotals(c); a.goal+=t.goal; a.played+=t.played; return a; }, {goal:0,played:0});
}

/* ---------- toast ---------- */
function toast(msg){
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._h);
  t._h = setTimeout(()=>t.classList.remove("show"), 2200);
}

/* ---------- abandoned media (shared across all categories) ---------- */
function describeAbandon(category, item, goalMin, playedMin){
  if(category==="games") return `Abandoned at ${fmtHM(Math.round(playedMin))} of ${fmtN(item.goal)}h`;
  if(category==="movies") return `Abandoned at ${fmtHM(Math.round(playedMin))} of ${fmtHM(item.length)}`;
  const watchedEp = (item.groups||[]).reduce((a,g)=>a+g.watched,0);
  const totalEp = (item.groups||[]).reduce((a,g)=>a+g.total,0);
  return `Abandoned at ${watchedEp}/${totalEp} episodes`;
}
function abandonItem(category, id){
  if(!confirm("Set this aside as abandoned? It'll stop counting toward your stats.")) return;
  const item = S[category].find(x=>x.id===id);
  const fn = MIN_FN[category];
  const {goal,played} = fn(item);
  item.abandoned = true;
  item.abandonNote = describeAbandon(category, item, goal, played);
  item.abandonLogIndex = (S.sessionLog||[]).length; // marks "when" for the reco cooldown factor
  if(category==="games") item.lastPlayed = false;
  persist(); toast("Set aside.");
}
function restoreItem(category, id){
  const item = S[category].find(x=>x.id===id);
  item.abandoned = false; item.abandonNote = "";
  delete item.abandonLogIndex;
  persist(); toast("Restored — back in the mix.");
}
function removeGeneric(category, id){
  if(category==="games") return removeGame(id);
  if(category==="movies") return removeMovie(id);
  return removeEpisodic(category, id);
}
function abandonedCard(category, item){
  return `<article class="entry abandoned-entry">
    <div class="entry-top"><div><div class="entry-name serif">${esc(item.name)}</div><div class="entry-meta mono">${esc(item.abandonNote||"")}</div></div></div>
    <div class="entry-foot" style="margin-top:10px"><span></span><div class="foot-links"><button onclick="restoreItem('${category}','${item.id}')">Restore</button><button onclick="removeGeneric('${category}','${item.id}')">Remove</button></div></div>
  </article>`;
}

/* ---------- tabs ---------- */
const TAB_ORDER = ["overview","games","movies","tv","anime"];
function switchTab(t){
  const oldIdx = TAB_ORDER.indexOf(activeTab);
  const newIdx = TAB_ORDER.indexOf(t);
  activeTab = t;
  localStorage.setItem("expedition-tab", t);
  render();
  window.scrollTo(0,0);
  if(oldIdx!==-1 && newIdx!==-1 && oldIdx!==newIdx) playPageTransition(newIdx>oldIdx ? "right" : "left");
}
function playPageTransition(dir){
  const el = $("app");
  el.classList.remove("page-enter-left","page-enter-right");
  void el.offsetWidth; // force reflow so the animation restarts even if triggered again quickly
  el.classList.add(dir==="right" ? "page-enter-right" : "page-enter-left");
}

function renderTabBar(){
  const order = ["overview","games","movies","tv","anime"];
  $("tabbar").innerHTML = order.map(t=>{
    const c = CAT[t];
    return `<button class="tab ${activeTab===t?'on':''}" style="--tabcolor:${c.color}" onclick="switchTab('${t}')">
      <span class="mono-badge">${iconBadge(t)}</span><span>${c.label}</span>
    </button>`;
  }).join("");
}

/* ============ GAMES ============ */
function openGameModal(id=null){
  editId = id;
  $("dlcRows").innerHTML = "";
  if(id){
    const g = S.games.find(x=>x.id===id);
    $("formTitle").textContent = "Edit entry";
    $("gname").value = g.name; $("goal").value = g.goal; $("played").value = g.played;
    $("hasDlc").checked = !!g.hasDlc;
    (g.dlcs||[]).forEach(addDlcRow);
  } else {
    $("formTitle").textContent = "New entry";
    $("gname").value = ""; $("goal").value = ""; $("played").value = 0;
    $("hasDlc").checked = false;
  }
  toggleDlcSection();
  $("gameModal").classList.add("show"); $("gname").focus();
}
function toggleDlcSection(){ $("dlcSection").classList.toggle("open", $("hasDlc").checked); }
function addDlcRow(d={id:"",name:"",type:"time",goal:0}){
  const row = document.createElement("div");
  row.className = "dlc-edit";
  row.dataset.id = d.id || "";
  row.innerHTML = `<input class="dn" placeholder="DLC name" value="${esc(d.name)}">
    <select class="dt" onchange="this.closest('.dlc-edit').querySelector('.dg').disabled = this.value==='check'">
      <option value="time" ${d.type!=="check"?"selected":""}>Timed</option>
      <option value="check" ${d.type==="check"?"selected":""}>Checklist</option>
    </select>
    <input class="dg" type="number" min="0" step=".1" placeholder="Hours" value="${d.goal||""}" ${d.type==="check"?"disabled":""}>
    <button class="btn small" onclick="this.parentNode.remove()">×</button>`;
  $("dlcRows").appendChild(row);
}
function saveGame(){
  const name = $("gname").value.trim();
  const goal = +$("goal").value;
  if(!name || goal <= 0) return toast("Give it a name and a target above 0.");
  const played = Math.min(goal, Math.max(0, +$("played").value || 0));
  const hasDlc = $("hasDlc").checked;
  const dlcs = [];
  if(hasDlc){
    document.querySelectorAll(".dlc-edit").forEach(r=>{
      const n = r.querySelector(".dn").value.trim();
      const type = r.querySelector(".dt").value;
      if(!n) return;
      dlcs.push({ id: r.dataset.id || uid(), name:n, type, goal: type==="time" ? Math.max(0, +r.querySelector(".dg").value || 0) : 0, played:0, done:false });
    });
  }
  S.games.forEach(g => g.lastPlayed = false);
  if(editId){
    const g = S.games.find(x=>x.id===editId);
    const oldDlcs = g.dlcs || [];
    const mergedDlcs = dlcs.map(nd=>{
      const match = oldDlcs.find(od=>od.id===nd.id);
      if(!match) return nd;
      const playedVal = nd.type==="time" ? Math.min(match.played||0, nd.goal||match.played||0) : 0;
      return { ...nd, played: playedVal, done: match.done||false };
    });
    Object.assign(g, { name, goal, played, hasDlc, dlcs: mergedDlcs, lastPlayed: played<goal });
    checkAutoComplete(g);
  } else {
    S.games.push({ id: uid(), name, goal, played, hasDlc, dlcs, lastPlayed: played<goal, timerStart:null });
  }
  closeModal("gameModal"); persist(); toast("Entry saved.");
}
function checkAutoComplete(g){ if(g.goal>0 && g.played>=g.goal) g.lastPlayed = false; }
function finishGameEarly(id){
  const g = S.games.find(x=>x.id===id);
  g.goal = Math.max(0.1, Math.round(g.played*10)/10);
  g.played = g.goal;
  g.lastPlayed = false;
  persist(); toast(`Marked finished — target set to ${fmtN(g.goal)}h.`);
}
function finishDlcEarly(gameId, dlcId){
  const g = S.games.find(x=>x.id===gameId); const d = g.dlcs.find(x=>x.id===dlcId);
  d.goal = Math.max(0.1, Math.round((d.played||0)*10)/10);
  d.played = d.goal;
  persist(); toast("DLC marked finished.");
}
function removeGame(id){
  if(confirm("Remove this entry? This can't be undone.")){ S.games = S.games.filter(g=>g.id!==id); persist(); }
}
function toggleDlcDone(gameId, dlcId){
  const g = S.games.find(x=>x.id===gameId); const d = g.dlcs.find(x=>x.id===dlcId);
  d.done = !d.done; persist();
}
function toggleDlcsVisible(id){ $("dlcs-"+id).classList.toggle("open"); }

/* timer */
function anyTimerRunning(){ return S.games.find(g=>g.timerStart); }
function startTimer(id){
  const running = anyTimerRunning();
  if(running && running.id !== id) return toast(`Finish "${running.name}" first.`);
  const g = S.games.find(x=>x.id===id);
  g.timerStart = Date.now();
  persist();
}
function stopTimer(id){
  const g = S.games.find(x=>x.id===id);
  if(!g.timerStart) return;
  const elapsedMin = (Date.now()-g.timerStart)/60000;
  const trimmed = elapsedMin*0.9;
  g.played = Math.min(g.goal, g.played + trimmed/60);
  g.timerStart = null;
  S.games.forEach(x=>x.lastPlayed=false); g.lastPlayed = true;
  checkAutoComplete(g);
  logAction("games", g.id, g.name, trimmed, "timer");
  persist();
  toast(`Logged ${fmtHM(Math.round(trimmed))} (10% trimmed for interruptions 😉)`);
}
setInterval(()=>{
  S.games.forEach(g=>{
    if(g.timerStart){
      const el = document.getElementById("timerDisplay-"+g.id);
      if(el) el.textContent = fmtElapsed(Date.now()-g.timerStart);
    }
  });
}, 1000);

function dlcCleared(d){ return d.type==="check" ? !!d.done : (d.goal>0 && d.played>=d.goal); }
function combinedGamePct(g){
  const dlcs = g.dlcs||[];
  if(!dlcs.length) return null;
  const baseFrac = g.goal ? Math.min(1, g.played/g.goal) : 0;
  const dlcFracs = dlcs.map(d => d.type==="check" ? (d.done?1:0) : (d.goal ? Math.min(1, d.played/d.goal) : 0));
  const all = [baseFrac, ...dlcFracs];
  return all.reduce((a,b)=>a+b,0) / all.length * 100;
}
function gameCard(g){
  const {goal,played} = gameMin(g);
  const pct = goal ? played/goal*100 : 0;
  const done = pct >= 100;
  const timing = !!g.timerStart;
  const cls = "entry cat-games" + (g.lastPlayed && !timing ? " active":"") + (done?" complete":"") + (timing?" timing":"");
  const dlcs = g.dlcs||[];
  const hasDlcAny = g.hasDlc && dlcs.length>0;
  const dlcClearedCount = dlcs.filter(dlcCleared).length;
  const dlcAllCleared = hasDlcAny && allDlcCleared(g);
  const finalComplete = done && (!hasDlcAny || dlcAllCleared);
  const dlcTag = g.hasDlc ? `<button class="foot-links" style="background:none;border:none;padding:0" onclick="toggleDlcsVisible('${g.id}')"><span class="dlc-tag">◆ ${dlcClearedCount}/${dlcs.length} cleared ▾</span></button>` : "<span></span>";
  const combined = combinedGamePct(g);
  const combinedLine = combined!==null ? `<div class="entry-meta2" style="margin-top:3px">Combined with DLC: ${combined.toFixed(0)}%</div>` : "";
  const dlcPendingNote = done && hasDlcAny && !dlcAllCleared ? `<div class="entry-meta2" style="color:var(--brass);margin-top:2px">◆ DLC not finished (${dlcClearedCount}/${dlcs.length})</div>` : "";

  const dlcHtml = g.hasDlc ? `<div class="dlcs" id="dlcs-${g.id}">${dlcs.map(d=>{
      const cleared = dlcCleared(d);
      if(d.type==="check"){
        return `<div class="dlc-row"><div class="dlc-top"><span class="dlc-name">${esc(d.name)}</span><span class="dlc-val">${cleared?"✓ Cleared":"Not cleared"}</span></div><button class="btn small" style="margin-top:8px" onclick="toggleDlcDone('${g.id}','${d.id}')">${cleared?"Mark open":"Mark cleared"}</button></div>`;
      }
      const dp = d.goal ? Math.min(100, d.played/d.goal*100) : 0;
      return `<div class="dlc-row"><div class="dlc-top"><span class="dlc-name">${esc(d.name)}</span><span class="dlc-val">${cleared?"✓ ":""}${fmtN(d.played)}h / ${fmtN(d.goal)}h</span></div><div class="dlc-bar"><div class="dlc-fill" style="width:${dp}%"></div></div><div class="btn-row" style="margin-top:8px"><button class="btn small" onclick="openDlcSession('${g.id}','${d.id}')">Log time</button>${!cleared ? `<button class="btn small" onclick="finishDlcEarly('${g.id}','${d.id}')">Mark finished</button>` : ""}</div></div>`;
    }).join("")}</div>` : "";

  const controls = timing
    ? `<div class="timer-box"><span class="timer-dot"></span><span class="timer-time mono" id="timerDisplay-${g.id}">${fmtElapsed(Date.now()-g.timerStart)}</span></div>
       <button class="btn accent wide" style="margin-top:8px;--accent:#c1614a;--accent-text:#fff" onclick="stopTimer('${g.id}')">■ Finished playing</button>`
    : `<div class="controls">
        <button class="btn accent" onclick="startTimer('${g.id}')">▶ Start playing</button>
        <button class="btn" onclick="openSessionModal('games','${g.id}')">Log session</button>
      </div>`;

  let stampsHtml = "";
  if(done){
    stampsHtml = `<div class="stamp"><b>✓</b><span>CLEARED</span></div>`;
    if(dlcAllCleared) stampsHtml += `<div class="stamp stamp2"><b>✓</b><span>DLC</span></div>`;
  }

  return `<article class="${cls}" style="--accent:${CAT.games.color};--accent-text:${CAT.games.text}">
    ${stampsHtml}
    <div class="entry-top">
      <div><div class="entry-name serif">${esc(g.name)}</div><div class="entry-meta mono">TARGET ${fmtN(g.goal)}H</div></div>
      <div class="entry-pct">${done?"✓":pct.toFixed(1)+"%"}</div>
    </div>
    <div class="gauge"><div class="gauge-fill" style="width:${Math.min(100,pct)}%"></div></div>
    <div class="entry-stats">
      <div><div class="played">${fmtHM(Math.round(played))} <span style="color:var(--muted);font-weight:400">/ ${fmtN(g.goal)}h</span></div><div class="entry-meta2">${done?"Backlog cleared":"Time played"}</div></div>
      <div class="remaining">${done?"Fully cleared":fmtHM(Math.round(goal-played))+" to clear"}</div>
    </div>
    ${combinedLine}
    ${dlcPendingNote}
    ${controls}
    ${!timing ? `<div class="entry-foot">${dlcTag}<div class="foot-links">${!finalComplete ? `<button onclick="abandonItem('games','${g.id}')">Abandon</button>` : ""}${!done ? `<button onclick="finishGameEarly('${g.id}')">Finished early</button>` : ""}<button onclick="openGameModal('${g.id}')">Edit</button><button onclick="removeGame('${g.id}')">Remove</button></div></div>` : ""}
    ${dlcHtml}
  </article>`;
}

/* ============ TV + ANIME (episodic) ============ */
function openEpisodicModal(category, id=null){
  editId = id; epiCategory = category;
  epiInitializing = true;

  document.querySelectorAll(".group-edit").forEach(r=>{

  });

function stepGroup(category, entryId, groupId, delta){
  const e = S[category].find(x=>x.id===entryId);
  const g = e.groups.find(x=>x.id===groupId);
  const before = g.watched;
  g.watched = Math.max(0, Math.min(g.total, g.watched+delta));
  if(g.watched > before) logAction(category, e.id, e.name, (g.watched-before)*e.epLen, "episode");
  persist();
}

/* ---------- sort ---------- */
function setSort(cat, v){ localStorage.setItem("expedition-sort-"+cat, v); render(); }
function splitSorted(cat, list, fn){
  const sort = localStorage.getItem("expedition-sort-"+cat) || "rdesc";
  const withStats = list.filter(x=>!x.abandoned).map(item=>{
    const {goal,played}=fn(item);
    const done = goal>0 && played>=goal;
    return {item, remain:goal-played, pct: goal?played/goal:0, done};
  });
  const cmp = (a,b)=>{
    if(sort==="rask") return a.remain-b.remain;
    if(sort==="pdesc") return b.pct-a.pct;
    if(sort==="pask") return a.pct-b.pct;
    return b.remain-a.remain;
  };
  const incomplete = withStats.filter(x=>!x.done).sort(cmp);
  const completed = withStats.filter(x=>x.done).sort((a,b)=>(a.item.name||"").localeCompare(b.item.name||""));
  return { incomplete: incomplete.map(x=>x.item), completed: completed.map(x=>x.item) };
}

    <option value="rask" ${sort==="rask"?"selected":""}>Least remaining</option>

}

/* ============ Smart recommendation engine ============
   Not real AI — a transparent scoring pass over everything still in progress.
   Each factor is an independent function so new ones can be added later
   without touching the others. */
function hashStr(str){
  let h=0;
  for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i))|0; }
  return h>>>0;
}
function seededRandom(seed){
  let t = seed += 0x6D2B79F5;
  t = Math.imul(t ^ t>>>15, t|1);
  t ^= t + Math.imul(t ^ t>>>7, t|61);
  return ((t ^ t>>>14) >>> 0) / 4294967296;
}

function buildRecoCandidates(){
  const list = [];
  S.games.forEach(g=>{
    if(g.abandoned || g.timerStart) return;
    const {goal,played} = gameMin(g);
    const mainDone = goal>0 && played>=goal;
    if(!mainDone){
      list.push({ id:g.id, name:g.name, category:"games", remainMin:Math.max(0,goal-played), pct: goal?played/goal:0 });
    } else {
      const hasDlcAny = g.hasDlc && (g.dlcs||[]).length>0;
      if(hasDlcAny && !allDlcCleared(g)){
        const total=(g.dlcs||[]).length, clearedN=(g.dlcs||[]).filter(dlcCleared).length;
        const remainMin = (g.dlcs||[]).filter(d=>!dlcCleared(d)).reduce((a,d)=> a + (d.type==="time" ? Math.max(0,(d.goal-d.played)*60) : 30), 0);
        list.push({ id:g.id, name:g.name+" (DLC)", category:"games", remainMin, pct: total?clearedN/total:0 });
      }
    }
  });
  S.movies.forEach(m=>{
    if(m.abandoned) return;
    const {goal,played} = movieMin(m);
    if(played>=goal) return;
    list.push({ id:m.id, name:m.name, category:"movies", remainMin:Math.max(0,goal-played), pct: goal?played/goal:0 });
  });
  ["tv","anime"].forEach(cat=>{
    S[cat].forEach(e=>{
      if(e.abandoned) return;
      const {goal,played} = episodicMin(e);
      if(goal>0 && played>=goal) return;
      list.push({ id:e.id, name:e.name, category:cat, remainMin:Math.max(0,goal-played), pct: goal?played/goal:0 });
    });
  });
  return list;
}
/* ---------- v0.8 streak model ----------
   Streak "entities" are derived fresh from the session log every time — no extra
   persisted state needed. An entity is either a specific title (games/tv/anime,
   keyed by category+id) or the whole "movies" category (movies boost as a group
   since a single movie is finished in one sitting).
   Each entity has:
     repeatCount — how many times it was touched within the recent scan window
     age         — actions since it was LAST touched (0 = just touched)
   Touching an entity resets its age to 0 (full strength) even mid-fade, but
   repeatCount (and therefore the diminishing-returns math) keeps accumulating. */
const STREAK_SCAN_WINDOW = 20;   // only look at the last N actions for entity counting
const STREAK_WAIT_ACTIONS = 3;   // full strength held for this many actions after a touch
const STREAK_FADE_ACTIONS = 5;   // then linearly fades to 0 over this many more actions
const STREAK_PRIMARY_START = 28, STREAK_PRIMARY_FLOOR = 8;
const STREAK_OTHER_START = 5, STREAK_OTHER_CAP = 22;
const STREAK_STEP = 6; // per-repeat shift: primary shrinks by this, other-categories grow by this

function streakFade(age){
  if(age <= STREAK_WAIT_ACTIONS) return 1;
  const decayed = age - STREAK_WAIT_ACTIONS;
  if(decayed >= STREAK_FADE_ACTIONS) return 0;
  return 1 - decayed/STREAK_FADE_ACTIONS;
}
function buildStreakEntities(log){
  const recentLog = log.slice(-STREAK_SCAN_WINDOW);
  const map = {};
  recentLog.forEach((e,i)=>{
    const isMovie = e.category==="movies";
    const key = isMovie ? "movies" : e.category+":"+e.id;
    if(!map[key]) map[key] = { category:e.category, itemId: isMovie ? null : e.id, count:0, lastIndex:-1 };
    map[key].count++;
    map[key].lastIndex = i;
  });
  const lastIdx = recentLog.length - 1;
  const entities = [];
  Object.values(map).forEach(v=>{
    const age = lastIdx - v.lastIndex;
    if(streakFade(age) <= 0) return; // fully decayed, drop it
    entities.push({ category:v.category, itemId:v.itemId, repeatCount:v.count, age });
  });
  return entities;
}

/* ---------- v0.8 category balance ----------
   Looks at total goal minutes vs. played minutes per category (across the whole
   active season list, not just candidates) and nudges points toward whichever
   category is proportionally furthest behind, so one category can't quietly
   finish while another barely moves. */
function buildCategoryBalance(){
  const cats = ["games","movies","tv","anime"];
  const pct = {};
  cats.forEach(cat=>{ const t = categoryTotals(cat); pct[cat] = t.goal>0 ? t.played/t.goal : null; });
  const active = cats.filter(c=>pct[c]!=null);
  if(active.length < 2) return {};
  const avg = active.reduce((a,c)=>a+pct[c],0) / active.length;
  const balance = {};
  active.forEach(c=>{ balance[c] = avg - pct[c]; }); // positive = behind average = needs a boost
  return balance;
}

/* ---------- v0.8 abandon cooldown ----------
   Recently abandoning something in a category strongly discourages recommending
   that category again for a while, fading out over the following actions rather
   than being permanent. */
function buildAbandonCooldown(){
  const logLen = (S.sessionLog||[]).length;
  const cooldown = {};
  ["games","movies","tv","anime"].forEach(cat=>{
    let minAge = Infinity;
    (S[cat]||[]).forEach(item=>{
      if(item.abandoned && typeof item.abandonLogIndex === "number"){
        const age = logLen - item.abandonLogIndex;
        if(age < minAge) minAge = age;
      }
    });
    if(minAge !== Infinity) cooldown[cat] = minAge;
  });
  return cooldown;
}

/* ---------- v0.9.1 pacing ----------
   Small, secondary nudges based on recent session shape and overall season pace —
   never meant to be a dominant factor, just enough to break ties between
   same-length items. Four signals, each kept deliberately weak:
     appetite      — lots of minutes logged in one sitting recently = appetite for
                      something long; the same minutes spread across several
                      different titles = short-session mood instead. Movies only.
     behindPace    — cumulative played-so-far vs. what's needed to clear the
                      season on schedule; if behind, nudge toward longer items
                      (bigger dent per sitting). Applies to everything.
     daysLeftSignal— early-to-mid season (lots of runway left) gently favors
                      starting long commitments like games/shows. Fades out by
                      the final ~30% of the season so it never fights the
                      end-of-season pressure factor.
*/
function buildPacingContext(){
  const log = S.sessionLog || [];
  const now = Date.now();
  const WINDOW = 30*3600*1000; // last ~day (with a little slack for late-night logging)
  const recent = log.filter(e => now - e.ts <= WINDOW);
  const recentMinutes = recent.reduce((a,e)=>a+(e.minutes||0), 0);
  const distinctTouched = new Set(recent.map(e=>e.category+":"+e.id)).size;

  let appetite = Math.max(-1, Math.min(1, (recentMinutes-120)/150));
  if(distinctTouched >= 2) appetite = Math.max(-1, appetite - 0.5); // fragmented = short-session mood

  const totals = combinedTotals();
  const remainingActive = Math.max(0, totals.goal - totals.played);
  const dLeft = daysLeft();
  const sLen = seasonLengthDays();
  const elapsed = Math.max(1, sLen - (dLeft==null ? sLen : dLeft));
  const neededPace = (dLeft && dLeft>0) ? remainingActive/dLeft : 0;
  const actualPace = totals.played/elapsed;
  const behindPace = neededPace>0 ? Math.max(0, Math.min(1, (neededPace-actualPace)/neededPace)) : 0;

  const daysLeftFraction = (dLeft!=null && sLen>0) ? dLeft/sLen : 0;
  const daysLeftSignal = Math.max(0, Math.min(1, (daysLeftFraction-0.3)/0.7));

  return { appetite, behindPace, daysLeftSignal };
}
function pacingSizeSignal(remainMin){
  return Math.max(-1, Math.min(1.3, (remainMin-110)/110));
}

function buildRecoContext(){
  const log = S.sessionLog || [];
  const last = log.length ? log[log.length-1] : null;
  const quietDays = !log.length || (Date.now() - log[log.length-1].ts > 36*3600*1000);
  return {
    last, quietDays,
    daysLeftInSeason: daysLeft(),
    streakEntities: buildStreakEntities(log),
    categoryBalance: buildCategoryBalance(),
    abandonCooldown: buildAbandonCooldown(),
    pacing: buildPacingContext(),
  };
}
const RECO_FACTORS = [
  { key:"momentum", fn:(c,ctx)=>{
    let pts = c.pct*10;
    if(c.pct>=0.7) pts += 8;
    if(ctx.last && ctx.last.id===c.id && ctx.last.category===c.category) pts += 6;
    return pts;
  }},
  { key:"streak", fn:(c,ctx)=>{
    if(!ctx.streakEntities.length) return 0;
    let pts = 0;
    ctx.streakEntities.forEach(ent=>{
      const fade = streakFade(ent.age);
      if(fade<=0) return;
      const isMovieEntity = ent.category==="movies";
      const matchesExact = isMovieEntity ? c.category==="movies" : (c.category===ent.category && c.id===ent.itemId);
      if(matchesExact){
        const mag = Math.max(STREAK_PRIMARY_FLOOR, STREAK_PRIMARY_START - STREAK_STEP*(ent.repeatCount-1));
        pts += mag*fade;
      } else if(!isMovieEntity && c.category===ent.category){
        // same category, different specific title — no boost, that's the point of "streak"
      } else {
        const mag = Math.min(STREAK_OTHER_CAP, STREAK_OTHER_START + STREAK_STEP*(ent.repeatCount-1));
        pts += mag*fade;
      }
    });
    return pts;
  }},
  { key:"balance", fn:(c,ctx)=>{
    const b = ctx.categoryBalance[c.category];
    if(b==null) return 0;
    return Math.max(-16, Math.min(22, b*46));
  }},
  { key:"inactivity", fn:(c,ctx)=>{
    if(!ctx.quietDays) return 0;
    return Math.max(0, 6 - (c.remainMin/60)*1.2);
  }},
  { key:"pressure", fn:(c,ctx)=>{
    const d = ctx.daysLeftInSeason;
    if(d==null || d>20 || d<0) return 0;
    let urgency = Math.pow((20-d)/20, 1.5);
    if(d<=7) urgency *= 1 + (7-d)*0.35; // last week ramps up hard
    const remainHours = Math.max(0.1, c.remainMin/60);
    return urgency * 22 * (1/(1+remainHours/5));
  }},
  { key:"cooldown", fn:(c,ctx)=>{
    const age = ctx.abandonCooldown[c.category];
    if(age==null) return 0;
    if(age<=5) return -24;
    if(age>=20) return 0;
    return -24 * (20-age)/15;
  }},
  { key:"pacing", fn:(c,ctx)=>{
    const p = ctx.pacing;
    const size = pacingSizeSignal(c.remainMin);
    let pts = 0;
    if(c.category==="movies") pts += p.appetite * size * 6;      // recent-session mood, movies only
    pts += p.behindPace * size * 5;                               // catch-up nudge, all categories
    if(c.category!=="movies") pts += p.daysLeftSignal * size * 4; // early-season runway, longer commitments
    return Math.max(-9, Math.min(9, pts));
  }},
];
const RECO_MESSAGES = {
  momentum: [
    "Ready to dive back in? {name} is right where you left it.",
    "Pick up where you left off with {name}.",
    "You're close on {name} — only {remain} left.",
    "Almost there with {name}: {remain} to go and it's cleared.",
    "{name} is within reach — {remain} left to finish it.",
    "Don't lose the thread — {name} is waiting mid-story.",
    "{name} was going well. Back in?",
  ],
  streak: [
    "Still feeling it? {name} fits the mood you've been in.",
    "Keep it going with {name}.",
    "You've been on a roll with {catLabel} — {name} keeps it going.",
    "In the zone — {name} is the natural next move.",
    "Riding the {catLabel} wave? {name} fits right in.",
    "Since you're already in it, {name} keeps the momentum.",
  ],
  balance: [
    "Your {catLabel} list has been sitting a while — {name} could use some attention.",
    "{catLabel} is falling behind the rest of your season. Give {name} a shot?",
    "It's been mostly other things lately — {name} would balance things out.",
    "Don't let {catLabel} stall out — {name} is right there.",
  ],
  inactivity: [
    "Something light to ease back in: {name} ({remain} left).",
    "Quick win incoming — {name} only needs {remain}.",
    "Been a couple days — {name} is a short one to get moving again.",
    "Easing back in? {name} is a low-commitment start.",
  ],
  pressure: [
    "The season's winding down — why not finish {name}?",
    "Only {daysLeft} days left in the season. {name} could be a quick clear.",
    "{name} is finishable before the season ends — {remain} to go.",
    "Crunch time: {name} is one of the few you can actually still close out.",
    "{daysLeft} days on the clock — {name} is worth the push.",
  ],
  pacing: [
    "You've had the time for something meatier lately — {name} fits.",
    "Something shorter fits better right now — {name} won't overstay its welcome.",
    "Keeping pace with the season — {name} helps close the gap.",
    "Plenty of runway left this season — a good time to start {name}.",
  ],
  default: [
    "How about {name}?",
    "Maybe give {name} a shot next.",
    "{name} is sitting there, {remain} left whenever you're ready.",
    "No strong pull either way — {name} is as good a pick as any.",
    "{name} could use some time whenever you're free.",
  ],
};
function fillTemplate(tpl, c){
  return tpl.replace("{name}", c.name)
            .replace("{remain}", fmtHM(Math.round(c.remainMin)))
            .replace("{catLabel}", CAT[c.category].label)
            .replace("{daysLeft}", String(daysLeft()==null?"":daysLeft()));
}
function pickRecommendation(){
  const candidates = buildRecoCandidates();
  if(!candidates.length) return null;
  const ctx = buildRecoContext();
  const scored = candidates.map(c=>{
    const factors = RECO_FACTORS.map(f=>({key:f.key, pts:f.fn(c,ctx)}));
    const total = factors.reduce((a,f)=>a+f.pts,0);
    return { ...c, total, factors };
  });
  scored.sort((a,b)=>b.total-a.total);
  const chosen = scored[0];
  const baseSeed = hashStr(S.sessionLog.length + "|" + todayStr());
  const dominant = chosen.factors.reduce((best,f)=> f.pts>best.pts?f:best, {key:"default",pts:-Infinity}).key;
  const pool = RECO_MESSAGES[dominant] && RECO_MESSAGES[dominant].length ? RECO_MESSAGES[dominant] : RECO_MESSAGES.default;
  const msgIdx = Math.min(pool.length-1, Math.floor(seededRandom(baseSeed)*pool.length));
  return { chosen, message: fillTemplate(pool[msgIdx], chosen), top5: scored.slice(0,5) };
}
function recommendationCardHtml(){
  const reco = pickRecommendation();
  if(!reco) return "";
  const meta = CAT[reco.chosen.category];
  const expandId = "reco-expand";
  const maxScore = Math.max(1, reco.top5[0].total);
  const rows = reco.top5.map((c,i)=>{
    const cmeta = CAT[c.category];
    const barPct = Math.max(0, Math.min(100, (c.total/maxScore)*100));
    return `<div class="reco-row ${i===0?'top':''}">
      <div class="reco-row-top">
        <span class="reco-rank mono">#${i+1}</span>
        <span class="mono-badge" style="--accent:${cmeta.color};width:26px;height:26px">${iconBadge(c.category)}</span>
        <span class="reco-row-name">${esc(c.name)}</span>
        <span class="reco-row-remain mono">${fmtHM(Math.round(c.remainMin))}</span>
        <span class="reco-score mono" style="--accent:${cmeta.color}">${Math.round(c.total)}</span>
      </div>
      <div class="reco-bar-track"><div class="reco-bar-fill" style="width:${barPct}%;--accent:${cmeta.color};background:${cmeta.color}"></div></div>
    </div>`;
  }).join("");
  return `<div class="reco-card" style="--accent:${meta.color}">
    <div class="reco-clickzone" onclick="toggleArchiveExpand('${expandId}')">
      <div class="reco-top-row">
        <div class="eyebrow" style="color:${meta.color}">Up Next</div>
        <span class="reco-chevron-wrap mono"><span class="reco-chevron">▾</span> Top 5</span>
      </div>
      <div class="reco-top">
        <span class="mono-badge" style="--accent:${meta.color}">${iconBadge(reco.chosen.category)}</span>
        <span class="reco-name serif">${esc(reco.chosen.name)}</span>
        <span class="reco-score-badge mono">${Math.round(reco.chosen.total)}</span>
      </div>
      <div class="reco-msg">${esc(reco.message)}</div>
    </div>
    <div class="archive-expand" id="${expandId}">
      <div class="reco-board-head mono">Top picks, by score</div>
      ${rows}
    </div>
    <div class="reco-cta" onclick="switchTab('${reco.chosen.category}')">Open ${esc(meta.label)} →</div>

function renderOverview(){
  const combined = combinedTotals();
  const remain = Math.max(0, combined.goal-combined.played);
  const pct = combined.goal>0 ? combined.played/combined.goal*100 : 100;
  const d = daysLeft();
  const liveSnap = seasonSnapshot(S.games, S.movies, S.tv, S.anime);
  const abandonedCount = liveSnap.abandoned.length;

  let html = `<section class="season">
    <div class="eyebrow">${esc(quarterLabel(S.seasonStart))} · This Season</div>
    <div class="season-grid">
      <div class="stat"><b>${fmtHM(Math.round(combined.goal))}</b><span>Total picked</span></div>
      <div class="stat"><b>${fmtHM(Math.round(combined.played))}</b><span>Finished</span></div>
      <div class="stat"><b>${fmtHM(Math.round(remain))}</b><span>Remaining</span></div>
      <div class="stat"><b>${pct.toFixed(1)}%</b><span>Cleared</span></div>
      <div class="stat"><b>${d==null?"—":d<0?"Past due":d+"d"}</b><span>Left in season</span></div>
      <div class="stat"><b>${abandonedCount}</b><span>Abandoned</span></div>
    </div>
    ${paceBoxHtml(combined, d)}
    <div class="season-actions">
      <button class="btn small ghost" onclick="exportData()">Export backup</button>
      <button class="btn small ghost" onclick="importData()">Import backup</button>
    </div>
  </section>
  ${recommendationCardHtml()}
  <div class="tiles">`;

  ["games","movies","tv","anime"].forEach(cat=>{
    const t = categoryTotals(cat);
    const tp = t.goal>0 ? t.played/t.goal*100 : 100;
    const meta = CAT[cat];
    html += `<button class="tile" style="--accent:${meta.color}" onclick="switchTab('${cat}')">
      <div class="tile-top"><span class="mono-badge">${iconBadge(cat)}</span><span class="tile-pct">${tp.toFixed(0)}%</span></div>
      <div class="tile-name">${meta.label}</div>
      <div class="tile-sub">${t.count} item${t.count===1?"":"s"} · ${fmtHM(Math.round(Math.max(0,t.goal-t.played)))} left</div>
      <div class="tile-bar"><div class="tile-fill" style="width:${Math.min(100,tp)}%"></div></div>
    </button>`;
  });
  html += `</div>`;

  html += `<div class="eyebrow" style="margin:18px 2px 10px">Seasons</div>`;
  html += currentSeasonCardHtml(liveSnap);
  if(S.archive && S.archive.length){
    S.archive.forEach(a=> html += archiveCardHtml(a));
  }

  $("app").innerHTML = html;
}

function paceBoxHtml(combined, d){
  if(!S.seasonStart) return "";
  const elapsed = Math.max(1, Math.round((new Date(todayStr()+"T00:00:00")-new Date(S.seasonStart+"T00:00:00"))/86400000)+1);
  const actualDaily = combined.played>0 ? combined.played/elapsed : 0;
  const remain = Math.max(0, combined.goal-combined.played);
  const neededDaily = (d>0 && remain>0) ? remain/d : null;
  if(!actualDaily && neededDaily===null) return "";
  let status = "";
  if(neededDaily!==null && combined.played>0){
    status = actualDaily>=neededDaily
      ? `<div class="pace-status good">✓ On track</div>`
      : `<div class="pace-status behind">⚠ Behind pace</div>`;
  }
  return `<div class="pace-box">
    ${combined.played>0 ? `<div class="pace-row"><span>So far</span><b>${fmtHM(Math.ceil(actualDaily))}/day</b></div>` : ""}
    ${neededDaily!==null ? `<div class="pace-row"><span>Needed</span><b>${fmtHM(Math.ceil(neededDaily))}/day</b></div>` : ""}
    ${status}
  </div>`;
}

function archiveDetailHtml(games, movies, episodic, abandoned){
  const group = (title, items) => items.length ? `<div class="archive-detail-group"><b>${title}</b>${items.map(x=>`<div class="archive-detail-item">${esc(x)}</div>`).join("")}</div>` : "";
  let html = "";
  html += group("Games cleared", games.map(g=>g.name));
  html += group("Movies watched", movies.map(m=>m.name));
  html += group("Seasons/arcs finished", episodic.map(e=>`${e.name} (${CAT[e.category].label})`));
  if(abandoned.length){
    html += `<div class="archive-detail-group"><b>Abandoned</b>${abandoned.map(x=>`<div class="archive-detail-item muted">${esc(x.name)} — ${esc(x.note||"")}</div>`).join("")}</div>`;
  }
  if(!games.length && !movies.length && !episodic.length && !abandoned.length){
    html = `<div class="archive-detail-item muted">Nothing finished yet.</div>`;
  }
  return html;
}

function buildGameGroups(){
  const sort = localStorage.getItem("expedition-sort-games") || "rdesc";
  const cmp = (a,b)=>{
    if(sort==="rask") return a.remain-b.remain;
    if(sort==="pdesc") return b.pct-a.pct;
    if(sort==="pask") return a.pct-b.pct;
    return b.remain-a.remain;
  };
  const active=[], inprog=[], dlcPending=[], cleared=[], abandoned=[];
  S.games.forEach(g=>{
    if(g.abandoned){ abandoned.push(g); return; }
    const {goal,played} = gameMin(g);
    const mainDone = goal>0 && played>=goal;
    if(!mainDone){ (g.lastPlayed ? active : inprog).push(g); return; }
    const hasDlcAny = g.hasDlc && (g.dlcs||[]).length>0;
    if(hasDlcAny && !allDlcCleared(g)) dlcPending.push(g);
    else cleared.push(g);
  });
  const inprogSorted = inprog.map(g=>{ const {goal,played}=gameMin(g); return {g,remain:goal-played,pct:goal?played/goal:0}; })
    .sort(cmp).map(x=>x.g);
  const dlcSorted = dlcPending.map(g=>{
      const total=(g.dlcs||[]).length, clearedN=(g.dlcs||[]).filter(dlcCleared).length;
      return {g, remain: total-clearedN, pct: total? clearedN/total:0};
    }).sort(cmp).map(x=>x.g);
  const clearedSorted = [...cleared].sort((a,b)=>(a.name||"").localeCompare(b.name||""));
  const abandonedSorted = [...abandoned].sort((a,b)=>(a.name||"").localeCompare(b.name||""));
  return { active, inprog: inprogSorted, dlcPending: dlcSorted, cleared: clearedSorted, abandoned: abandonedSorted };
}
function renderGames(){
  const totals = categoryTotals("games");
  let html = statbar("games", totals);
  html += `<div class="btn-row" style="margin-bottom:14px"><button class="btn accent wide" style="--accent:${CAT.games.color};--accent-text:${CAT.games.text}" onclick="openGameModal()">+ New Entry</button></div>`;
  if(!S.games.length){

  const {active, inprog, dlcPending, cleared, abandoned} = buildGameGroups();

  html += `<div class="list-head"><b>ENTRIES</b>${sortDropdown("games")}</div>`;
  active.forEach(g=>{ html += `<div class="marginalia">currently playing</div>`; html += gameCard(g); });
  inprog.forEach(g=> html += gameCard(g));
  if(dlcPending.length){
    html += `<div class="marginalia">main cleared · dlc pending</div>`;

  if(cleared.length){

    cleared.forEach(g=> html += gameCard(g));

  if(abandoned.length){
    html += `<div class="marginalia">abandoned</div>`;
    abandoned.forEach(g=> html += abandonedCard("games", g));
  }
  $("app").innerHTML = html;
}

function renderEpisodicTab(category){
  const totals = categoryTotals(category);
  const meta = CAT[category];
  const addLabel = category==="anime" ? "+ Add Anime" : "+ Add Show";
  let html = statbar(category, totals);
  html += `<div class="btn-row" style="margin-bottom:14px"><button class="btn accent wide" style="--accent:${meta.color};--accent-text:${meta.text}" onclick="openEpisodicModal('${category}')">${addLabel}</button></div>`;
  const list = S[category];
  if(!list.length){
    html += `<div class="empty"><span class="serif">Nothing here yet</span>Add ${category==="anime"?"an anime":"a show"} to start tracking episodes.</div>`;
    $("app").innerHTML = html; return;
  }
  html += `<div class="list-head"><b>ENTRIES</b>${sortDropdown(category)}</div>`;
  const {incomplete, completed} = splitSorted(category, list, episodicMin);

    completed.forEach(e=> html += episodicCard(category, e));
  }

  if(abandonedList.length){
    html += `<div class="marginalia">abandoned</div>`;
    abandonedList.forEach(e=> html += abandonedCard(category, e));
  }
  $("app").innerHTML = html;
}

function render(){
  renderTabBar();
  if(activeTab==="overview") renderOverview();
  else if(activeTab==="games") renderGames();
  else if(activeTab==="movies") renderMovies();
  else renderEpisodicTab(activeTab);

/* ---------- v0.9 swipe navigation ----------
   Swipe left/right anywhere to move between tabs, in the same order as the tab bar.
   Listens on `document` rather than #app: #app's height shrinks to fit its content,
   so on a short page (e.g. a category with few entries) touches below the visible
   list would land outside #app and never register — document always covers the
   full screen so swipes work everywhere, on every page, regardless of length. */
(function setupSwipeNav(){
  const MIN_DIST = 60;      // minimum horizontal travel to count as a swipe
  const MAX_SLOPE = 0.65;   // vertical/horizontal ratio allowed before it's treated as a scroll
  let sx = 0, sy = 0, tracking = false;
  document.addEventListener("touchstart", e=>{
    if(e.touches.length !== 1 || document.querySelector(".modal.show") || e.target.closest(".tabbar")){ tracking=false; return; }
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; tracking = true;
  }, {passive:true});
  document.addEventListener("touchend", e=>{
    if(!tracking) return;
    tracking = false;
    if(document.querySelector(".modal.show")) return; // guard again in case a modal opened mid-gesture
    const t = e.changedTouches[0];
    const dx = t.clientX - sx, dy = t.clientY - sy;
    if(Math.abs(dx) < MIN_DIST || Math.abs(dy) > Math.abs(dx)*MAX_SLOPE) return;
    const idx = TAB_ORDER.indexOf(activeTab);
    if(dx < 0 && idx < TAB_ORDER.length-1) switchTab(TAB_ORDER[idx+1]);
    else if(dx > 0 && idx > 0) switchTab(TAB_ORDER[idx-1]);
  }, {passive:true});
})();

/* ---------- v0.9 installability ----------
   Registers a minimal service worker so Android Chrome treats this as a fully
   installable PWA (standalone window, no address bar) rather than just a bookmark
   shortcut. Wrapped defensively: service workers require a secure context, so this
   silently no-ops on plain file:// pages in browsers that don't allow it there —
   "Add to Home Screen" still works either way, just possibly as a browser shortcut
   instead of a standalone window on those browsers. */
if("serviceWorker" in navigator){
  try{
    const swCode = `self.addEventListener('fetch',()=>{});`; // pass-through, satisfies install criteria
    const swUrl = URL.createObjectURL(new Blob([swCode], {type:"text/javascript"}));
    navigator.serviceWorker.register(swUrl).catch(()=>{});
  }catch(e){}
}

$("verTag").textContent = "v" + APP_VERSION;
render();
